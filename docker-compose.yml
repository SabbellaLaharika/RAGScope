version: '3.8'

services:
  vector_db:
    image: qdrant/qdrant:v1.7.4
    container_name: ragscope-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  eval_harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragscope-eval-harness
    env_file:
      - .env
    environment:
      - VECTOR_DB_HOST=vector_db
      - VECTOR_DB_PORT=6333
    volumes:
      - ./results:/app/results
      - ./config:/app/config
      - ./.env:/app/.env
    depends_on:
      vector_db:
        condition: service_healthy

volumes:
  qdrant_data:

